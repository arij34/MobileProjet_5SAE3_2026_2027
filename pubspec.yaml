name: mygym
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/core/assets/images/app_icon.png"
  adaptive_icon_foreground: "lib/core/assets/images/app_icon.png"